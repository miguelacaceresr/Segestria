[package]
name = "segestria-core"
version = "0.1.0"
edition.workspace = true

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "sync", "io-util"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
hex = "0.4"
md-5 = "0.10"
uuid = { version = "1", features = ["v3"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
# Solo PNG: lo único que decodificamos/codificamos son los panoramas del tema
# (ver theme::grade_png). Sin default-features para no arrastrar jpeg, gif,
# webp y compañía adentro del instalador.
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "5"
thiserror = "1"
sysinfo = "0.32"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
